<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>GroupHub Admin · Sign in</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="brand"><img class="brand-emblem" src="/emblem.webp" alt="" width="34" height="34"> GroupHub <span>Admin</span></div>
    <h1>Sign in</h1>
    <p class="muted">Moderator access only.</p>
    <form id="loginForm" novalidate>
      <label for="password">Admin password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <p class="error" id="loginError" role="alert" hidden></p>
      <button class="btn primary" type="submit" id="loginBtn">Sign in</button>
    </form>
    <p class="muted small"><a href="/">← Back to GroupHub</a></p>
  </main>
  <script src="/admin/assets/login.js" defer></script>
</body>
</html>
